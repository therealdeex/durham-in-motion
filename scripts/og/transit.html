<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Georgia, 'Times New Roman', serif; position: relative; background: #faf7f1; }
  .top { position: absolute; left: 0; right: 0; top: 0; height: 232px; background: #0f1418; }
  .top::after { content: ""; position: absolute; inset: 0; background:
    radial-gradient(ellipse 80% 60% at 20% 0%, rgba(0,133,122,0.18), transparent),
    radial-gradient(ellipse 50% 80% at 95% 100%, rgba(245,176,67,0.12), transparent); }
  .kicker { position: absolute; left: 72px; top: 78px; font-family: Arial, sans-serif; font-size: 15px; letter-spacing: 0.28em; text-transform: uppercase; color: #f5b043; font-weight: 600; z-index: 2; }
  h1 { position: absolute; left: 72px; top: 116px; font-size: 96px; line-height: 1.0; color: #ecf1f0; font-weight: 600; z-index: 2; }
  .rail { position: absolute; left: 72px; top: 316px; }
  .sub { position: absolute; left: 72px; top: 470px; font-family: Arial, sans-serif; font-size: 24px; color: #4d545c; width: 700px; line-height: 1.5; }
  .sub strong { color: #1c2024; }
  .stat { position: absolute; right: 84px; top: 316px; text-align: right; font-family: Arial, sans-serif; }
  .stat .n { font-size: 64px; color: #c2502e; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 15px; color: #4d545c; margin-top: 4px; width: 330px; }
  .brand { position: absolute; left: 72px; bottom: 44px; font-family: Arial, sans-serif; font-size: 16px; color: #8a9099; letter-spacing: 0.08em; }
</style>
</head>
<body>
  <div class="top"></div>
  <div class="kicker">A story from the 2022 Transportation Tomorrow Survey</div>
  <h1>The Transit Journey</h1>

  <svg class="rail" width="640" height="120" viewBox="0 0 640 120">
    <!-- the chain: HOME → access → station → GO → link → destination -->
    <g font-family="Arial" font-size="13" fill="#4d545c" text-anchor="middle">
      <circle cx="40" cy="60" r="26" fill="#c2502e"/>
      <text x="40" y="65" fill="#faf7f1" font-size="11" font-weight="700">HOME</text>
      <line x1="70" y1="60" x2="150" y2="60" stroke="#98938a" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round"/>
      <circle cx="190" cy="60" r="20" fill="#f5b043"/>
      <text x="190" y="65" fill="#1c2024" font-size="10" font-weight="700">WALK</text>
      <text x="190" y="102" font-size="11">access leg</text>
      <line x1="214" y1="60" x2="286" y2="60" stroke="#98938a" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round"/>
      <circle cx="330" cy="60" r="26" fill="#00857a"/>
      <text x="330" y="65" fill="#faf7f1" font-size="10" font-weight="700">GO</text>
      <text x="330" y="102" font-size="11">the train</text>
      <line x1="360" y1="60" x2="432" y2="60" stroke="#98938a" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round"/>
      <circle cx="476" cy="60" r="20" fill="#33567d"/>
      <text x="476" y="65" fill="#faf7f1" font-size="10" font-weight="700">BUS</text>
      <text x="476" y="102" font-size="11">another link</text>
      <line x1="500" y1="60" x2="574" y2="60" stroke="#98938a" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round"/>
      <circle cx="600" cy="60" r="20" fill="#c2502e"/>
      <text x="600" y="65" fill="#faf7f1" font-size="9" font-weight="700">WORK</text>
    </g>
  </svg>

  <div class="stat">
    <div class="n">90.8%</div>
    <div class="l">of riders board at Oshawa GO having arrived by car</div>
  </div>

  <p class="sub">A transit trip starts <strong>before the train arrives</strong> — a chain of legs the mode-share chart never shows.</p>
  <div class="brand">Durham in Motion</div>
</body>
</html>
